[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-candidate-discovery-benchmark"
version = "0.1.0"
description = "Public-data benchmark for cost-aware protein candidate discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Protein Candidate Discovery Benchmark contributors" }]
dependencies = [
  "numpy>=2,<3",
  "scikit-learn>=1.9,<2",
  "xgboost-cpu>=3.2,<3.3",
]

[project.optional-dependencies]
dev = [
  "jsonschema[format-nongpl]>=4.23,<5",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
pcdb = "pcdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# Preserve the executed E3 source hash; import classification differs by checkout layout.
"scripts/run_m5_e3_prediction.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
