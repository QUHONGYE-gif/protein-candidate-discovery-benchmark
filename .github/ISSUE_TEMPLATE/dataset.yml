name: Dataset onboarding
description: 作为 Major / semantic change 引入或升级公开 dataset/task/assay
title: "[Dataset] "
labels: ["needs-triage"]
body:
  - type: dropdown
    id: tracking_threshold_reason
    attributes:
      label: Independent tracking threshold
      description: 此表单选择 `github_issue`；若选择 `multica`，请勿创建形式性的 GitHub Issue。
      options:
        - Major / semantic change
        - Independent value, acceptance criteria, risk, or authorization boundary
        - Cross-milestone, multi-PR, multi-owner, or external coordination
        - Data, held-out, permission, cost, privacy, security, release, or external-config risk
        - No suitable parent Issue
    validations:
      required: true
  - type: checkboxes
    id: github_tracking_authority
    attributes:
      label: Tracking authority
      options:
        - label: 我确认本对象选择 `github_issue`，而不是 `multica`
          required: true
  - type: input
    id: multica_tracking
    attributes:
      label: Multica execution tracking
      description: 可填写一个或多个 Multica issue URL；允许多个 Multica issues 对应本 Issue。
  - type: input
    id: source
    attributes:
      label: Source URL
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License / redistribution terms
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and label semantics
      description: candidate unit、label direction、missing values 和 high-value definition。
    validations:
      required: true
  - type: textarea
    id: split
    attributes:
      label: Split and leakage controls
      description: duplicate、similarity、protein/complex grouping 和 held-out boundary。
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Manifest outputs
      description: 计划生成的 checksum、COS prefix 和 audit artifacts。
    validations:
      required: true
