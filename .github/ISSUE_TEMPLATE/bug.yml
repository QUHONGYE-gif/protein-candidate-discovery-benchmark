name: Bug report
description: 可复现的实现、数据或运行错误
title: "[Bug] "
labels: ["needs-triage"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: commit、command、config hash 和非敏感日志。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence boundary
      description: 说明这是 local、CI、server runtime 还是 scientific result 问题。
    validations:
      required: true
