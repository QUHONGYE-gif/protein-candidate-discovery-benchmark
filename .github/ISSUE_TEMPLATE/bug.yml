name: Bug report
description: 达到独立 Issue 门槛的可复现实现、数据或运行错误
title: "[Bug] "
labels: ["needs-triage"]
body:
  - type: dropdown
    id: tracking_threshold_reason
    attributes:
      label: Independent tracking threshold
      description: 此表单选择 `github_issue`；若选择 `multica`，请勿创建形式性的 GitHub Issue。
      options:
        - Major / semantic change
        - Independent value, acceptance criteria, risk, or authorization boundary
        - Cross-milestone, multi-PR, multi-owner, or external coordination
        - Data, held-out, permission, cost, privacy, security, release, or external-config risk
        - No suitable parent Issue
    validations:
      required: true
  - type: checkboxes
    id: github_tracking_authority
    attributes:
      label: Tracking authority
      options:
        - label: 我确认本对象选择 `github_issue`，而不是 `multica`
          required: true
  - type: input
    id: multica_tracking
    attributes:
      label: Multica execution tracking
      description: 可填写一个或多个 Multica issue URL；允许多个 Multica issues 对应本 Issue。
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: commit、command、config hash 和非敏感日志。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence boundary
      description: 说明这是 local、CI、server runtime 还是 scientific result 问题。
    validations:
      required: true
