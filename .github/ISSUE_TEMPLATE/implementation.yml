name: Implementation
description: 达到独立 Issue 门槛且有明确接口与验收标准的工程实现
title: "[Implementation] "
labels: ["needs-triage"]
body:
  - type: dropdown
    id: independent_issue_reason
    attributes:
      label: Independent GitHub Issue threshold
      description: 纯 maintenance 且已有父 Issue 时，请改用父 Issue checklist，不新建 Issue。
      options:
        - Major / semantic change
        - Independent value, acceptance criteria, risk, or authorization boundary
        - Cross-milestone, multi-PR, multi-owner, or external coordination
        - Data, held-out, permission, cost, privacy, security, release, or external-config risk
        - No suitable parent Issue
    validations:
      required: true
  - type: input
    id: multica_tracking
    attributes:
      label: Multica execution tracking
      description: 可填写一个或多个 Multica issue URL；允许多个 Multica issues 对应本 Issue。
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么现在需要这个实现？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 列出包含和明确不包含的内容。
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract / Interface
      description: 涉及的 API、Schema、输入输出或 failure behavior。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 使用可验证的 checklist。
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Scientific claim boundary
      description: 说明完成实现后仍不能声称什么。
    validations:
      required: true
