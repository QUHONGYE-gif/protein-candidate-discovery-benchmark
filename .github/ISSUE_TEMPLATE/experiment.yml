name: Experiment
description: 作为 Major / semantic change 定义 development、pilot 或 frozen Benchmark 实验
title: "[Experiment] "
labels: ["needs-triage"]
body:
  - type: dropdown
    id: independent_issue_reason
    attributes:
      label: Independent GitHub Issue threshold
      description: 纯 maintenance 且已有父 Issue 时，请改用父 Issue checklist，不新建 Issue。
      options:
        - Major / semantic change
        - Independent value, acceptance criteria, risk, or authorization boundary
        - Cross-milestone, multi-PR, multi-owner, or external coordination
        - Data, held-out, permission, cost, privacy, security, release, or external-config risk
        - No suitable parent Issue
    validations:
      required: true
  - type: input
    id: multica_tracking
    attributes:
      label: Multica execution tracking
      description: 可填写一个或多个 Multica issue URL；允许多个 Multica issues 对应本 Issue。
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: 要检验的问题或假设，避免预设结论。
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: ["smoke", "development", "pilot", "frozen"]
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Frozen protocol inputs
      description: dataset/split/config hashes、model、acquisition、seed、budget 和 cost。
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Metrics, gates and stop conditions
      description: 在查看结果前定义 acceptance、failure 和停止条件。
    validations:
      required: true
  - type: checkboxes
    id: heldout
    attributes:
      label: Held-out boundary
      options:
        - label: 本 Issue 不会在未授权时读取 held-out labels
          required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Expected COS artifacts
      description: 预期 run ID、object prefix、manifest 和 summary。
    validations:
      required: true
